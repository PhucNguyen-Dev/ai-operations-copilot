# pnpm 12 settings live here (package.json "pnpm" field is no longer read).
# Approve dependency build scripts — npm ran all of these before the
# pnpm migration, so this keeps behavior identical. None are risky:
# native binaries for test/build tooling and transitive deps.
dangerouslyAllowAllBuilds: true

onlyBuiltDependencies:
  - '@confluentinc/kafka-javascript'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@sentry/node-cpu-profiler'
  - '@sentry/node-native-stacktrace'
  - agent-browser
  - cpu-features
  - esbuild
  - '@tailwindcss/oxide'
  - isolated-vm
  - msgpackr-extract
  - oracledb
  - protobufjs
  - sqlite3
  - ssh2
  - unrs-resolver
  - vue-demi
